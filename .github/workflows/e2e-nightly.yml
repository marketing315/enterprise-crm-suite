name: e2e-nightly

on:
  schedule:
    # Every night at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Manual trigger

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_BRAND_NAME: ${{ secrets.E2E_BRAND_NAME }}
      PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      E2E_WEBHOOK_URL: https://127.0.0.1:5055/webhook
      E2E_WEBHOOK_FAIL_URL: https://127.0.0.1:5055/webhook/fail
      MOCK_WEBHOOK_PORT: 5055
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed test data
        run: |
          psql "$DATABASE_URL" -f scripts/seed-e2e-sla-breach.sql
          psql "$DATABASE_URL" -f scripts/seed-e2e-inbound-source.sql

      - name: Generate SSL cert for mock receiver
        run: |
          mkdir -p scripts/certs
          openssl req -x509 -newkey rsa:2048 \
            -keyout scripts/certs/server.key \
            -out scripts/certs/server.crt \
            -days 1 -nodes \
            -subj "/CN=localhost"

      - name: Start mock webhook receiver
        run: |
          node scripts/mock-webhook-receiver.js &
          sleep 2

      - name: Run ALL E2E tests (full suite)
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14
