name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked secrets
        run: |
          echo "🔍 Scanning repository for leaked secrets..."
          
          # Patterns that should NEVER appear in tracked files
          PATTERNS=(
            'service_role'
            'sk_live_'
            'sk_test_'
            'SUPABASE_SERVICE_ROLE_KEY\s*='
            'CRON_SECRET\s*='
            'OPENAI_API_KEY\s*='
            'GOOGLE_SHEETS_PRIVATE_KEY\s*='
            'META_APP_SECRET\s*='
            'HMAC_SECRET\s*='
            'DATABASE_URL\s*=\s*postgresql://'
            'password\s*=\s*["\x27][^\s]{8,}'
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            # Search tracked files, excluding lock files, binaries, and this workflow
            MATCHES=$(git grep -lniE "$pattern" -- ':!bun.lockb' ':!package-lock.json' ':!*.yml' ':!node_modules' ':!.github/workflows/secrets-scan.yml' 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Pattern '$pattern' found in:"
              echo "$MATCHES" | sed 's/^/   /'
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🚨 Secret leak detected! Move private credentials to Cloud secrets."
            echo "   Only publishable keys (anon key, project URL) are allowed in the repo."
            exit 1
          fi

          echo "✅ No leaked secrets found."
