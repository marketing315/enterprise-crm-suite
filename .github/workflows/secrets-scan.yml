name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked secrets
        run: |
          echo "🔍 Scanning repository for leaked secrets..."
          
          # Patterns that should NEVER appear in tracked files.
          # NOTE: we look for ASSIGNMENTS of secrets (KEY=value), not bare references
          # like Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") which are legitimate.
          # For Supabase JWTs we match the base64url fingerprint of the
          # "role":"service_role" claim, so anon keys (publishable) are NOT flagged.
          PATTERNS=(
            'sk_live_[A-Za-z0-9]{20,}'
            'sk_test_[A-Za-z0-9]{20,}'
            'eyJ[A-Za-z0-9_-]*(InJvbGUiOiJzZXJ2aWNlX3JvbGUi|cm9sZSI6InNlcnZpY2Vfcm9sZS)'
            'SUPABASE_SERVICE_ROLE_KEY\s*=\s*["\x27]?eyJ'
            'CRON_SECRET\s*=\s*["\x27]?[A-Za-z0-9]{16,}'
            'OPENAI_API_KEY\s*=\s*["\x27]?sk-'
            'GOOGLE_SHEETS_PRIVATE_KEY\s*=\s*["\x27]?-----BEGIN'
            'META_APP_SECRET\s*=\s*["\x27]?[a-f0-9]{32,}'
            'HMAC_SECRET\s*=\s*["\x27]?[A-Za-z0-9]{16,}'
            'DATABASE_URL\s*=\s*["\x27]?postgresql://[^:]+:[^@\s]{8,}@'
            'password\s*=\s*["\x27][^\s$\{]{8,}'
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            # Search tracked files, excluding lock files, binaries, examples, docs and this workflow
            MATCHES=$(git grep -lniE "$pattern" -- \
              ':!bun.lockb' \
              ':!package-lock.json' \
              ':!*.yml' \
              ':!node_modules' \
              ':!*.example' \
              ':!.env.e2e.example' \
              ':!docs/**' \
              ':!.github/workflows/secrets-scan.yml' 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Pattern '$pattern' found in:"
              echo "$MATCHES" | sed 's/^/   /'
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🚨 Secret leak detected! Move private credentials to Cloud secrets."
            echo "   Only publishable keys (anon key, project URL) are allowed in the repo."
            exit 1
          fi

          echo "✅ No leaked secrets found."
