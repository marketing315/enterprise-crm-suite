name: revenue-critical

# Dedicated workflow for the 5 revenue-critical E2E flows.
# Runs on every PR + push to main, plus on a 6h schedule against the
# live preview to catch regressions introduced by infra/data changes
# (Supabase migrations applied out-of-band, RLS edits, etc.).
#
# This is the LAST line of defense before money-losing regressions
# reach production. Failures here page the on-call.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'e2e/revenue-critical/**'
      - 'e2e/fixtures/**'
      - 'playwright.config.ts'
      - '.github/workflows/revenue-critical.yml'
  push:
    branches: [main]
  schedule:
    # Every 6h — catches drift in Supabase RLS / edge functions
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  revenue-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_BRAND_NAME: ${{ secrets.E2E_BRAND_NAME }}
      PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @revenue-critical suite
        id: rc
        run: npx playwright test --grep @revenue-critical --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-critical-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Surface failure in run summary (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "## :rotating_light: Revenue-critical E2E failed (scheduled drift check)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triage within 1h. Check the Playwright report artifact for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
